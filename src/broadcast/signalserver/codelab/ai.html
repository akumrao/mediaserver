<script>




window.addEventListener("resize", resize_win);
function resize_win()
{

    var elm =   document.getElementById("remoteVideo");

    resize_canvas(elm);
}

function resize_canvas(element)
{
  var w = element.offsetWidth;
  var h = element.offsetHeight;

  var cv = document.getElementById("cv1");
  cv.width = w;
  cv.height =h;
  

}
